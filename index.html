<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Sasmita ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <audio id="bg-music" src="assets/bubu-dudu-atata.mp3" loop></audio>
    <div id="hearts-container"></div>
    
    <div class="header">
        <h1 id="main-message">Pull us toward each other! 🥺</h1>
        <p id="sub-message">Use two fingers or drag us together ❤️</p>
    </div>

    <div class="interactive-area">
        <div id="dudu-container" class="character-container" style="left: 10%; top: 50%;">
            <div class="thinking-bubble">Thinking of Bubu... 💭</div>
            <img src="assets/bubu-dudu.gif" alt="Dudu" class="character-img" id="dudu-img" draggable="false">
            <div class="name-tag">Aayush (Dudu)</div>
        </div>

        <div id="bubu-container" class="character-container" style="left: 60%; top: 50%;">
            <div class="thinking-bubble">Thinking of Dudu... 💭</div>
            <img src="assets/bubu-dudu-bubu.gif" alt="Bubu" class="character-img" id="bubu-img" draggable="false">
            <div class="name-tag">Sasmita (Bubu)</div>
        </div>

        <div id="flowers-container" class="hidden absolute-center">
            <img src="assets/bubu-received-flowers-from-dudu-n4gkl2zhjxi7qwnm.gif" alt="Flowers" class="hug-img">
            <div class="name-tag backpack-tag">Flowers for my Sasmita! 🌸</div>
        </div>

        <div id="extra-container" class="hidden absolute-center">
            <img src="assets/bubu-bubu-dudu-2.gif" alt="Extra" class="hug-img">
            <div class="name-tag backpack-tag">You're my Kuchipuchi pu! 🥰</div>
        </div>

        <div id="backpack-container" class="hidden absolute-center">
            <img src="assets/bubu-bubu-dudu.gif" alt="Backpack" class="hug-img">
            <div class="name-tag backpack-tag">I love you to eternity! ❤️</div>
        </div>

        <div id="love-container" class="hidden absolute-center">
            <img src="assets/bubu-dudu-images-bubu-dudu-love.gif" alt="Love" class="hug-img">
            <div class="name-tag backpack-tag">I love you! 💖</div>
        </div>

        <div id="kiss-container" class="hidden absolute-center">
            <img src="assets/bubu-dudu-sseeyall.gif" alt="Kissing" class="hug-img">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
